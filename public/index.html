<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Biblioteca</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>📚 Gestor de Biblioteca</h1>
  </header>

  <main>
    <!-- Sección de login -->
    <section id="login" class="tarjeta">
      <h2>Iniciar sesión</h2>
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="admin" autocomplete="username">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" placeholder="••••••" autocomplete="current-password">
      <button id="btn-login">Entrar</button>
      <p id="login-msg" class="mensaje-error"></p>
    </section>

    <!-- Panel principal (oculto al inicio) -->
    <section id="panel" class="oculto">
      <div class="tarjeta">
        <div class="encabezado-panel">
          <h2>Agregar libro</h2>
          <button id="btn-salir" class="secundario">Cerrar sesión</button>
        </div>
        <div class="formulario">
          <div>
            <label for="titulo">Título</label>
            <input type="text" id="titulo">
          </div>
          <div>
            <label for="autor">Autor</label>
            <input type="text" id="autor">
          </div>
          <div>
            <label for="copias">Copias</label>
            <input type="number" id="copias" min="0">
          </div>
          <button id="btn-agregar">Agregar</button>
        </div>
        <p id="form-msg" class="mensaje-error"></p>
      </div>

      <div class="tarjeta">
        <h2>Libros registrados</h2>
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Autor</th>
              <th>Copias</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-libros"></tbody>
        </table>
        <p id="tabla-vacia" class="vacio">No hay libros registrados.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
